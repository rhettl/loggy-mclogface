name: Build and test
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        shell: bash
        run: |
          BASE_VERSION="$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties)"
          VERSION="${BASE_VERSION}-SNAPSHOT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
              echo "Release tags must use vX.Y.Z" >&2
              exit 1
            }
            VERSION="${BASH_REMATCH[1]}"
          fi
          ./gradlew build --no-daemon -Pmod_version="$VERSION"
